<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivo Central - Inicio</title>
    
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
    <style>
        /* Estilos específicos para la página de inicio */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            background: radial-gradient(circle at center, #f8fafc 0%, #e2e8f0 100%);
        }

        .hub-title {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #1a202c, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hub-subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 4rem;
        }

        .hub-grid {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1000px;
        }

        .hub-card {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 20px;
            padding: 3rem 2rem;
            width: 280px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        .hub-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            border-color: currentColor;
        }

        /* Colores específicos para los hover de cada tarjeta */
        .hub-card.ahpna:hover {
            color: #2b6cb0;
            box-shadow: 0 15px 40px rgba(43, 108, 176, 0.15);
        }
        .hub-card.urbanismo:hover {
            color: #2f855a;
            box-shadow: 0 15px 40px rgba(47, 133, 90, 0.15);
        }
        .hub-card.ama:hover {
            color: #c53030;
            box-shadow: 0 15px 40px rgba(197, 48, 48, 0.15);
        }

        .hub-icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
        }

        .hub-card h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .hub-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
        }

    </style>
</head>
<body>
    <div class="top-nav" style="position: absolute; top: 1.5rem; right: 1.5rem; display: flex; gap: 1rem; align-items: center; justify-content: flex-end; width: auto; z-index: 100; margin-bottom: 0;">
        <a href="users.html" class="admin-only-card top-nav-admin-btn">Gestión Usuarios</a>
    </div>

    <div class="background-effects">
        <div class="glow-orb" style="top: 20%; left: 30%; background: radial-gradient(circle, rgba(102, 252, 241, 0.1) 0%, transparent 70%);"></div>
        <div class="glow-orb" style="bottom: 20%; right: 30%; background: radial-gradient(circle, rgba(168, 230, 207, 0.1) 0%, transparent 70%);"></div>
    </div>

    <h1 class="hub-title">Archivo Central</h1>
    <p class="hub-subtitle">Seleccione la base de datos que desea consultar</p>

    <div class="hub-grid">
        <a href="ahpna.html" class="hub-card ahpna">
            <div class="hub-icon">📜</div>
            <h2>AHPNA</h2>
            <p>Archivo Histórico de Protocolos Notariales</p>
        </a>

        <a href="urbanismo.html" class="hub-card urbanismo">
            <div class="hub-icon">🏗️</div>
            <h2>Urbanismo</h2>
            <p>Base de datos de expedientes y planeamiento urbano</p>
        </a>

        <a href="ama.html" class="hub-card ama">
            <div class="hub-icon">🏛️</div>
            <h2>AMA</h2>
            <p>Archivo Municipal de Algeciras</p>
        </a>

    </div>
</body>
</html>
